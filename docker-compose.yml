# Fault-flag monolith. No faults enabled.
# All image tags are pinned; bump them deliberately.
# Host ports bind to 127.0.0.1 only.
name: llm-chaos-lab

x-otel-env: &otel-env
  OTEL_SERVICE_NAME: chaos-api
  # GenAI semconv is Development status; pin the opt-in so upgrades are explicit.
  OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
  # Content capture off by default (PII). Turning it on is a Lab 5 fault, not a default.
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
      # Written by the game-day selector. Absent = no faults.
      - path: .gameday/faults.env
        required: false
    environment:
      <<: *otel-env
      LAB_OTLP_ENDPOINT: http://otel-collector:4318
      LAB_PG_VECTOR_DSN: postgresql://lab:lab@pgvector:5432/vectors
      LAB_PG_STATE_DSN: postgresql://lab:lab@postgres-state:5432/agent_state
      LAB_QDRANT_URL: http://qdrant:6333
      LAB_LLM_BACKEND: stub
    depends_on:
      pgvector: {condition: service_healthy}
      postgres-state: {condition: service_healthy}
      qdrant: {condition: service_started}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.30.8-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}

  pgvector:
    # pgvector >= 0.8 for hnsw.iterative_scan (Lab 1).
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: vectors
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/postgres/pgvector-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d vectors"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-state:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: agent_state
    volumes:
      - state-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d agent_state"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # For comparing filtered-search semantics with pgvector (Lab 1).
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrant-data:/qdrant/storage
    ports: ["127.0.0.1:6333:6333"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [phoenix]

  phoenix:
    image: arizephoenix/phoenix:version-22.1.0
    ports: ["127.0.0.1:6006:6006"]
    volumes:
      - phoenix-data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.2.7
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  pgvector-data:
  state-data:
  qdrant-data:
  phoenix-data:
