# nginx 1.30.8. Defaults kept on purpose (proxy_buffering on, as shipped).
# The app opts SSE responses out of buffering with X-Accel-Buffering: no.
worker_processes auto;
events { worker_connections 1024; }

http {
  upstream api { server api:8000; }

  server {
    listen 80;

    location /chaos {
      # Admin endpoint: reachable only from the docker network / localhost bind.
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
    }
  }
}
