# Prometheus v3.15.1
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
